<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5ebe0;min-height:100vh;display:flex} .box{background:white;width:100%;min-height:100vh;padding:40px 24px;display:flex;flex-direction:column;justify-content:center;max-width:480px;margin:0 auto} @media(min-width:600px){body{justify-content:center;align-items:center;padding:20px} .box{min-height:auto;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}} input{width:100%;padding:14px;margin:10px 0;border:1px solid #e8ddd0;border-radius:12px;font-size:16px} .btn{width:100%;padding:14px;background:#1a9a5a;color:white;border:none;border-radius:12px;font-weight:700;margin-top:12px;font-size:16px;cursor:pointer}</style></head>
<body><div class="box"><h2 style="margin:0 0 6px;font-size:26px">Complete Training Payment</h2><p style="color:#7a6652;margin:0 0 24px;font-size:14px;line-height:1.5">Pay KES 350 once to unlock training and tasks</p><input id="phone" placeholder="M-Pesa Phone 07..."><button class="btn" onclick="pay()">Pay with M-Pesa</button><p style="text-align:center;margin-top:20px"><a href="dashboard.html" style="color:#ff7a00;text-decoration:none;font-weight:600">Back to Dashboard</a></p></div>
<script>async function pay(){const phone=document.getElementById('phone').value;if(!phone)return alert('enter phone');alert('STK Push sent to '+phone);localStorage.setItem('trained','yes');setTimeout(()=>location.href='dashboard.html',2000);}</script></body></html>
