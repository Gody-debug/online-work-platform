<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account - OnlineWorks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui;background:#fdf8f2;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{background:white;padding:32px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08);width:100%;max-width:400px;border:1px solid #f0e6d9}
h2{font-size:22px;margin-bottom:6px}.sub{color:#7a6652;font-size:13.5px;margin-bottom:20px}
input{width:100%;padding:12px 14px;border:1px solid #e9ddd0;border-radius:10px;margin-top:8px;font-size:14px}
input:focus{outline:none;border-color:#8c5a3c}
label{font-size:13px;font-weight:600;margin-top:14px;display:block}
.field-error{color:#d93025;font-size:11.5px;margin-top:4px;display:none}
.input-error{border:1px solid #d93025!important}
.btn{width:100%;background:#111;color:white;padding:13px;border:none;border-radius:10px;font-weight:700;margin-top:20px;cursor:pointer}
.btn:disabled{opacity:.6}
.link{margin-top:16px;text-align:center;font-size:13px}a{color:#8c5a3c;font-weight:600;text-decoration:none}
</style></head>
<body>
<div class="box">
<h2>Create account</h2><div class="sub">Join 12,000+ freelancers</div>
<form id="regForm">
<label>Full Name</label><input id="name" type="text" placeholder="John Doe"><div class="field-error">This field is required</div>
<label>Email</label><input id="email" type="email" placeholder="john@gmail.com"><div class="field-error">This field is required</div>
<label>Phone (M-Pesa)</label><input id="phone" type="tel" placeholder="07XXXXXXXX"><div class="field-error">This field is required</div>
<label>Password</label><input id="password" type="password" placeholder="••••••••"><div class="field-error">This field is required</div>
<button type="submit" class="btn" id="btn">Create Account</button>
</form>
<div class="link">Already have account? <a href="login.html">Login</a></div>
<div id="msg" style="margin-top:12px;font-size:13px;text-align:center"></div>
</div>
<script>
document.getElementById('regForm').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const fields = [
  document.getElementById('name'),
  document.getElementById('email'),
  document.getElementById('phone'),
  document.getElementById('password')
 ];
 let ok=true;
 fields.forEach(inp=>{
   const err = inp.nextElementSibling;
   if(inp.value.trim()===''){
     inp.classList.add('input-error');
     err.style.display='block';
     ok=false;
   } else {
     inp.classList.remove('input-error');
     err.style.display='none';
   }
 });
 if(!ok) return;

 const btn=document.getElementById('btn');
 btn.disabled=true; btn.textContent='Creating...';
 try{
   const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
     name:fields[0].value.trim(),
     email:fields[1].value.trim(),
     phone:fields[2].value.trim(),
     password:fields[3].value.trim()
   })});
   const data=await r.json();
   if(r.ok){
     document.getElementById('msg').style.color='green';
     document.getElementById('msg').textContent='Account created! Redirecting to payment...';
     localStorage.setItem('user', JSON.stringify(data.user || {email:fields[1].value}));
     setTimeout(()=>location.href='qualification.html', 1000);
   } else {
     document.getElementById('msg').style.color='#d93025';
     document.getElementById('msg').textContent=data.message || 'Failed to create account';
   }
 } catch(err){
   document.getElementById('msg').style.color='#d93025';
   document.getElementById('msg').textContent='Network error';
 }
 btn.disabled=false; btn.textContent='Create Account';
});
</script>
</body></html>
