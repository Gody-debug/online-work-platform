<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - WorkRemotely</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#fdf5e6;font-family:Arial,sans-serif}
.card{background:#ffffff;width:90%;max-width:420px;padding:32px 28px;border-radius:16px;box-shadow:0 8px 24px rgba(139,90,43,0.12)}
h2{color:#5a3210;text-align:center;margin:0 0 6px;font-size:28px} .sub{color:#8b7355;text-align:center;margin-bottom:22px;font-size:14px}
input{width:100%;box-sizing:border-box;padding:14px 16px;margin:8px 0;border-radius:12px;border:1px solid #e8dcc8;background:#fffbf0;outline:none;font-size:15px}
input:focus{border-color:#8b5a2b;background:#fff}
.btn{width:100%;padding:14px;background:#8b5a2b;color:white;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;transition:0.2s}
.btn:hover{background:#6f4621;transform:translateY(-1px)} .link{text-align:center;margin-top:16px;color:#8b7355;font-size:14px} .link a{color:#8b5a2b;font-weight:600;text-decoration:none}
.error{color:#b42318;font-size:13px;margin-top:4px;display:none}
</style>
</head>
<body>
<div class="card">
<h2>Create Account</h2><div class="sub">Join WorkRemotely today</div>
<input id="fullname" placeholder="Full Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (min 8 characters)" minlength="8">
<input id="confirm" type="password" placeholder="Confirm Password">
<div id="perr" class="error">Password must be at least 8 characters and match</div>
<button class="btn" onclick="handleRegister()">Register</button>
<div class="link">Already have account? <a href="login.html">Login</a></div>
</div>
<script>
function handleRegister(){
 const p=document.getElementById('password').value;
 const c=document.getElementById('confirm').value;
 const e=document.getElementById('perr');
 if(p.length<8 || p!==c){ e.style.display='block'; return; }
 e.style.display='none';
 if(typeof registerUser==='function') registerUser();
 else alert('Registered! (connect your registerUser function)');
}
</script>
</body>
</html>
