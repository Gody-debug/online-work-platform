 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="style.css">
<style>
body{ display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f5f5f5; }
.register-container{ background:white; padding:30px; border-radius:12px; width:100%; max-width:400px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
input,button{ width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ccc; }
button{ background:#111; color:white; cursor:pointer; }
</style>
<style>body{background:#fdf5e6 !important;min-height:100vh;display:flex;justify-content:center;align-items:center !important;} .register-container,.card,.container,form{background:#ffffff !important;border-radius:16px !important;box-shadow:0 8px 24px rgba(139,90,43,0.12) !important;max-width:420px !important;margin:auto !important;} input{background:#fffbf0 !important;border:1px solid #e8dcc8 !important;border-radius:12px !important;} button,.btn,#regBtn{background:#8b5a2b !important;color:white !important;border:none !important;border-radius:12px !important;font-weight:600 !important;} button:hover{background:#6f4621 !important;}</style></head>
<body>
<div class="register-container">
<h2 style="text-align:center;">Create Account</h2>
<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="password" minlength="8" required id="password" placeholder="Password">
<button onclick="registerUser()">Register</button>
<p style="text-align:center;">Already have account? <a href="login.html">Login</a></p>
</div>
<script src="script.js"></script>
<script>
// password length fix - does not touch firebase
document.addEventListener("DOMContentLoaded",()=>{
  const btn = document.querySelector("button, .btn, #regBtn");
  if(!btn) return;
  btn.addEventListener("click", (e)=>{
    const p = document.getElementById("password")?.value || "";
    const cp = document.getElementById("confirmPassword")?.value || document.getElementById("confirm")?.value || "";
    if(p.length < 8){
      alert("Password must be at least 8 characters");
      e.preventDefault(); e.stopImmediatePropagation();
      return false;
    }
    if(cp && p !== cp){
      alert("Passwords do not match");
      e.preventDefault(); e.stopImmediatePropagation();
      return false;
    }
  }, true);
});
</script>
</body>
</html>
