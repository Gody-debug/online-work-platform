<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#fdf5e6;font-family:Arial}
.card{background:#fff;width:90%;max-width:420px;padding:32px 28px;border-radius:16px;box-shadow:0 8px 24px rgba(139,90,43,0.12)}
h2{color:#5a3210;text-align:center;margin:0 0 6px} input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #e8dcc8;background:#fffbf0}
.btn{width:100%;padding:14px;background:#8b5a2b;color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer;margin-top:14px}
.btn:hover{background:#6f4621} .err{color:#b42318;font-size:13px;display:none;margin-top:6px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2>Create Account</h2>
<input id="fullname" placeholder="Full Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (min 8)">
<input id="confirm" type="password" placeholder="Confirm Password">
<div id="err" class="err"></div>
<button class="btn" id="regBtn">Register</button>
<p style="text-align:center;font-size:14px">Already have? <a href="login.html" style="color:#8b5a2b;font-weight:600">Login</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// YOUR FIREBASE CONFIG - KEEP YOUR ORIGINAL VALUES HERE
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById('regBtn').addEventListener('click', async () => {
 const name = document.getElementById('fullname').value.trim();
 const email = document.getElementById('email').value.trim();
 const pass = document.getElementById('password').value;
 const confirm = document.getElementById('confirm').value;
 const err = document.getElementById('err');

 if(!name || !email){ err.textContent="Fill all fields"; err.style.display="block"; return; }
 if(pass.length < 8){ err.textContent="Password must be at least 8 characters"; err.style.display="block"; return; }
 if(pass !== confirm){ err.textContent="Passwords do not match"; err.style.display="block"; return; }

 try{
  err.style.display="none";
  document.getElementById('regBtn').textContent="Creating...";
  const cred = await createUserWithEmailAndPassword(auth, email, pass);
  // STORE USER DETAILS IN FIRESTORE
  await setDoc(doc(db, "users", cred.user.uid), {
    fullName: name,
    email: email,
    createdAt: new Date(),
    balance: 0
  });
  // REDIRECT TO SURVEY
  window.location.href = "survey.html"; // change to your survey file name if different
 }catch(e){
  err.textContent=e.message; err.style.display="block";
  document.getElementById('regBtn').textContent="Register";
 }
});
</script>
</body>
</html>
