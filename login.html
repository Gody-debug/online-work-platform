<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<style>body{margin:0;font-family:Arial;background:#f8f5f0;display:flex;justify-content:center;align-items:center;min-height:100vh} .box{background:white;padding:30px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,0.08)} input{width:100%;padding:12px;margin:8px 0;border:1px solid #e8ddd0;border-radius:10px;box-sizing:border-box} .btn{width:100%;padding:12px;background:#ff7a00;color:white;border:none;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}</style></head>
<body style="background:#f5ebe0">
<div class="box">
<h2 style="margin:0 0 5px">Login</h2>
<p style="color:#7a6652;margin:0 0 20px;font-size:14px">Welcome Back<br>Login to access your tasks</p>
<input id="email" placeholder="you@example.com" type="email">
<input id="password" placeholder="Password" type="password">
<button class="btn" onclick="login()">Login</button>
<p style="text-align:center;margin-top:15px;font-size:14px"><a href="register.html" style="color:#ff7a00;text-decoration:none">No account? Register</a></p>
</div>
<script>
async function login(){
 const email=document.getElementById('email').value;
 const password=document.getElementById('password').value;
 if(!email||!password) return alert('fill all');
 const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
 const data=await res.json();
 if(data.token){localStorage.setItem('token',data.token);location.href='dashboard.html';} else alert(data.message||'failed');
}
</script>
</body></html>
