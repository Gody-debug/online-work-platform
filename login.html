<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - OnlineWorks</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#fdfbf6;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.box{background:white;max-width:400px;width:100%;border-radius:20px;padding:32px;border:1px solid #efe6d5}label{font-size:13px;font-weight:600;display:block;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #efe6d5;border-radius:10px;background:#fffaf0}.btn{width:100%;background:#a4714b;color:white;padding:14px;border:none;border-radius:10px;font-weight:700;margin-top:20px;cursor:pointer}img{width:100%;border-radius:12px;height:160px;object-fit:cover;margin-bottom:16px}</style>
</head>
<body>
<div class="box">
<img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=600" alt="login">
<h2>Welcome Back</h2><p style="color:#7a6652;font-size:14px;margin:8px 0 20px">Login to access your tasks</p>
<label>Email</label><input id="email" type="email" placeholder="you@example.com">
<label>Password</label><input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="location.href='/dashboard.html'">Login</button>
<p style="text-align:center;font-size:13px;margin-top:14px">No account? <a href="/register.html" style="color:#a4714b;font-weight:600">Register</a></p>
</div>
</body>
</html>
