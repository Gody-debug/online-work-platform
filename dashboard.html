<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<style>body{margin:0;font-family:Arial;background:#f5ebe0} .header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px} .card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05)} .card img{width:100%;height:160px;object-fit:cover;display:block} .card-body{padding:14px} .btn{background:#111;color:white;padding:10px 16px;border-radius:8px;border:none;font-weight:700;cursor:pointer;width:100%;margin-top:8px} .btn-outline{background:white;border:1px solid #e8ddd0;padding:10px 16px;border-radius:8px;width:100%;margin-top:8px;cursor:pointer}</style></head>
<body>
<div class="header"><b>Work Platform</b><div><a href="payment.html" style="margin-right:12px;color:#ff7a00;text-decoration:none">Activate</a><button onclick="localStorage.clear();location.href='login.html'">Logout</button></div></div>
<div id="jobs" class="grid"></div>
<script>
const fallbackImgs=[
"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600",
"https://images.unsplash.com/photo-1553877522-43269d4ea984?w=600",
"https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600",
"https://images.unsplash.com/photo-1542744173-8e7e53415bb4?w=600",
"https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600",
"https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=600"
];
async function load(){
 const res=await fetch('/api/jobs');
 const jobs=await res.json();
 document.getElementById('jobs').innerHTML=jobs.map((j,i)=>{
  let img=j.image;
  if(!img || img.length<10 || img.includes('placeholder') || j.title.toLowerCase().includes('document')){
    if(j.title.toLowerCase().includes('document')) img="https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=600";
    else img=fallbackImgs[i % fallbackImgs.length];
  }
  return `<div class="card"><img src="${img}" onerror="this.src='${fallbackImgs[i % fallbackImgs.length]}'"><div class="card-body"><h3 style="margin:0 0 6px;font-size:16px">${j.title}</h3><p style="margin:0;color:#7a6652;font-size:13px">KES ${j.payout||j.amount||150}</p><button class="btn" onclick="location.href='payment.html'">Start Task</button><button class="btn-outline" onclick="location.href='payment.html'">View Training First</button></div></div>`;
 }).join('');
}
load();
</script>
</body></html>
