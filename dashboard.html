<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<style>body{margin:0;font-family:Arial;background:#fdf8f2} .header{background:white;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:10} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px;padding:40px 32px;max-width:1250px;margin:0 auto} .card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06);border:1px solid #f0e6d9} .card img{width:100%;height:200px;object-fit:cover;display:block} .card-body{padding:18px} .btn{background:#111;color:white;padding:11px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer;width:100%;margin-top:10px} .btn-outline{background:white;border:1px solid #e8ddd0;padding:11px 16px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer;font-weight:600}</style></head>
<body>
<div class="header"><b>Work Platform</b><div><a href="payment.html" style="margin-right:12px;color:#ff7a00;text-decoration:none">Activate</a><button onclick="localStorage.clear();location.href='login.html'">Logout</button></div></div>
<div id="jobs" class="grid"></div>
<script>
const FALLBACK=["https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600","https://images.unsplash.com/photo-1553877522-43269d4ea984?w=600","https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600","https://images.unsplash.com/photo-1542744173-8e7e53415bb4?w=600","https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600","https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=600"];
const DOC_IMG="https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=600";
const varied=[1000,800,1250,950,1500,1100,1350,700,1200,850];
async function load(){
 const res=await fetch('/api/jobs');
 let jobs=await res.json();
 document.getElementById('jobs').innerHTML=jobs.map((j,i)=>{
  let amount=j.payout||j.amount||varied[i%varied.length];
  if(amount==900 && !j.title.toLowerCase().includes('document')) amount=varied[i%varied.length];
  if(j.title.toLowerCase().includes('document')) amount=950;
  let img=j.image;
  if(!img || img.length<10 || j.title.toLowerCase().includes('document')) img=j.title.toLowerCase().includes('document')?DOC_IMG:FALLBACK[i%FALLBACK.length];
  return `<div class="card"><img src="${img}" onerror="this.src='${FALLBACK[i%FALLBACK.length]}'"><div class="card-body"><h3 style="margin:0 0 6px;font-size:16px">${j.title}</h3><p style="margin:0;color:#7a6652;font-size:13px">KES ${amount} per task • Remote</p><button class="btn" onclick="location.href='payment.html'">Start Task</button><button class="btn-outline" onclick="location.href='payment.html'">View Training First</button></div></div>`;
 }).join('');
}
load();
</script>
</body></html>
