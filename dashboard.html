<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Online Works</title>
<style>body{font-family:Inter,sans-serif;background:#fdf8f2;margin:0;padding:20px} .top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto 20px} .card{background:white;border:1px solid #f0e6d9;border-radius:16px;padding:20px;max-width:1000px;margin:0 auto}</style>
</head><body>
<div class="top"><b>Online Works Platform</b><button onclick="localStorage.clear();location.href='login.html'">Logout</button></div>
<div class="card"><h2 id="welcome">Loading...</h2><p>Your account is active. You paid KES 150. Start working.</p><div id="jobs"></div></div>
<script>
(async()=>{
  const user=JSON.parse(localStorage.getItem('user')||'{}');
  if(!user.email){ location.href='login.html'; return; }
  const r=await fetch('/api/check-auth?email='+encodeURIComponent(user.email));
  const d=await r.json();
  if(!r.ok || !d.paid){ alert('Pay KES 150 to access dashboard'); location.href=(d.redirect||'payment.html')+'?email='+encodeURIComponent(user.email); return; }
  document.getElementById('welcome').textContent='Welcome, '+(d.user.name||user.email)+' - PAID ✓';
})();
</script>
</body></html>
